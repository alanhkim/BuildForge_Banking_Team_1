[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "regimpact"
version = "0.1.0"
description = "Data engineering/CLI pipeline framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "networkx>=3.0",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "typer>=0.12",
]

[project.optional-dependencies]
foundry = [
    "agent-framework",
    "azure-identity>=1.16",
]

[project.scripts]
regimpact = "regimpact.cli:app"

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
