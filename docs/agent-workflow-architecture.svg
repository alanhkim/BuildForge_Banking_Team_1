<text x="705.0" y="698.0" fill="#2f9e44" font-size="16" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" text-anchor="middle"><tspan x="705.0" dy="0.0">3. Gap Analysis</tspan><tspan x="705.0" dy="20.0">maturity + evidence</tspan><tspan x="705.0" dy="20.0">→ gaps</tspan></text>
