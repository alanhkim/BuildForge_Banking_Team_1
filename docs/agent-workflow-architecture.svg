<text x="62.0" y="98.0" fill="#495057" font-size="16" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" text-anchor="start"><tspan x="62.0" dy="0.0">Microsoft Agent Framework + Foundry Hosted Agent boundary, Entra-only auth, deterministic Python core, Fabric-ready outputs</tspan></text>
<text x="62.0" y="192.0" fill="#0b7285" font-size="16" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" text-anchor="start"><tspan x="62.0" dy="0.0">Inputs</tspan><tspan x="62.0" dy="20.0">• CLI / local demo</tspan><tspan x="62.0" dy="20.0">• Foundry Hosted endpoint</tspan><tspan x="62.0" dy="20.0">• Regulation text/catalog</tspan><tspan x="62.0" dy="20.0">• CHG-DORA demo change</tspan></text>
<text x="382.0" y="171.0" fill="#5f3dc4" font-size="16" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" text-anchor="start"><tspan x="382.0" dy="0.0">Foundry Hosted Agent</tspan><tspan x="382.0" dy="20.0">Microsoft Agent Framework wrapper</tspan><tspan x="382.0" dy="20.0"></tspan><tspan x="382.0" dy="20.0">• Managed endpoint</tspan><tspan x="382.0" dy="20.0">• Entra identity only</tspan><tspan x="382.0" dy="20.0">• Observability + lifecycle</tspan><tspan x="382.0" dy="20.0">• Calls portable core service</tspan></text>
<text x="782.0" y="194.0" fill="#1971c2" font-size="16" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" text-anchor="start"><tspan x="782.0" dy="0.0">Entra Auth</tspan><tspan x="782.0" dy="20.0">• Managed identity / OBO</tspan><tspan x="782.0" dy="20.0">• No API keys</tspan><tspan x="782.0" dy="20.0">• Foundry Responses API</tspan></text>
<text x="216.0" y="410.0" fill="#2b8a3e" font-size="20" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" text-anchor="start"><tspan x="216.0" dy="0.0">Portable Python Core (source of truth)</tspan></text>
<text x="220.0" y="450.0" fill="#2b8a3e" font-size="15" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start"><tspan x="220.0" dy="0.0">contracts.py                         catalog.py                         agents/interpreter.py</tspan><tspan x="220.0" dy="18.8">InterpretRequest/Response             DORA fixture                       deterministic fallback</tspan><tspan x="220.0" dy="18.8">Obligation schema                     REG-DORA / CHG-DORA                validates model/catalog output</tspan><tspan x="220.0" dy="18.8">Validation exceptions                 OBL-DORA-01                        returns structured obligations</tspan></text>
