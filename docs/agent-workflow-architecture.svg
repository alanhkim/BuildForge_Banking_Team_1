<text x="465.0" y="900.0" fill="#e67700" font-size="16" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" text-anchor="middle"><tspan x="465.0" dy="0.0">Deterministic Scoring</tspan><tspan x="465.0" dy="20.0">As-is → Post-change dip</tspan><tspan x="465.0" dy="20.0">→ Post-remediation recovery</tspan></text>
