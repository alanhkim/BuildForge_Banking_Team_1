      - { id: CTL-MR-2, name: "Model Validation & Backtesting", systems: [SYS-AIP, SYS-CREDIT] }
      - { id: CTL-MR-3, name: "Model Performance Monitoring", systems: [SYS-AIP] }
  - id: CF-AIGOV
    name: "AI Governance"
    owner_unit_id: BU-DATA
    risk_id: RK-MODEL
    capability: CAP-AIG
    evidence: [EV-AGENTEVAL, EV-MODELCARD]
    maturity_bias: 0
    controls:
      - { id: CTL-AI-1, name: "AI System Risk Classification", systems: [SYS-AIP] }
      - { id: CTL-AI-2, name: "Human Oversight & Approval", systems: [SYS-AIP] }
      - { id: CTL-AI-3, name: "Bias & Fairness Testing", systems: [SYS-AIP, SYS-LAKE] }
  - id: CF-TDQ
    name: "Training Data Quality"
    owner_unit_id: BU-DATA
    risk_id: RK-MODEL
    capability: CAP-TDQ
    evidence: [EV-DQ, EV-LINEAGE]
    maturity_bias: 0
    controls:
      - { id: CTL-TD-1, name: "Training Data Governance", systems: [SYS-AIP, SYS-LAKE] }
      - { id: CTL-TD-2, name: "Dataset Documentation & Provenance", systems: [SYS-AIP] }
  - id: CF-TRACE
    name: "Traceability & Explainability"
    owner_unit_id: BU-DATA
    risk_id: RK-MODEL
    capability: CAP-TRACE
    evidence: [EV-MODELCARD, EV-AUDIT]
    maturity_bias: 0
    controls:
      - { id: CTL-TR-1, name: "Decision Logging & Traceability", systems: [SYS-AIP, SYS-LAKE] }
      - { id: CTL-TR-2, name: "Model Explainability Reporting", systems: [SYS-AIP] }
  - id: CF-AUDIT
    name: "Auditability & Evidence"
    owner_unit_id: BU-RISK
    risk_id: RK-REPORT
    capability: CAP-AUD
    evidence: [EV-AUDIT]
    maturity_bias: 1
    controls:
      - { id: CTL-AU-1, name: "Immutable Audit Trail", systems: [SYS-LAKE, SYS-IAM] }
      - { id: CTL-AU-2, name: "Evidence Repository", systems: [SYS-LAKE] }
  - id: CF-REPORT
    name: "Regulatory Reporting"
    owner_unit_id: BU-FIN
    risk_id: RK-REPORT
    capability: CAP-REP
    evidence: [EV-AUDIT, EV-CAPREC]
    maturity_bias: 1
    controls:
      - { id: CTL-RP-1, name: "Regulatory Report Production", systems: [SYS-REGRPT] }
      - { id: CTL-RP-2, name: "Report Review & Sign-off", systems: [SYS-REGRPT, SYS-GL] }

# --------------------------------------------------------------------------- #
# Capability themes — the join between obligations and controls/data.
# --------------------------------------------------------------------------- #
themes:
  KYC_CDD:           { control_families: [CF-CDD],      data_domains: [DD-KYC, DD-CUSTPII] }
  SANCTIONS:         { control_families: [CF-SANCT],    data_domains: [DD-CUSTPII, DD-PAYMT] }
  TXN_MONITORING:    { control_families: [CF-TM],       data_domains: [DD-TXN, DD-PAYMT] }
  SAR_REPORTING:     { control_families: [CF-TM],       data_domains: [DD-TXN] }
  ICT_RESILIENCE:    { control_families: [CF-OPRES],    data_domains: [DD-REF] }
  ICT_SECURITY:      { control_families: [CF-ICTSEC, CF-CYBER], data_domains: [DD-REF, DD-CUSTPII] }
  INCIDENT_MGMT:     { control_families: [CF-ICTSEC],   data_domains: [DD-REF] }
  THIRD_PARTY_RISK:  { control_families: [CF-TPR],      data_domains: [DD-REF] }
  ACCESS_CONTROL:    { control_families: [CF-ACCESS],   data_domains: [DD-CUSTPII, DD-REF] }
  CYBER:             { control_families: [CF-CYBER],    data_domains: [DD-REF, DD-CUSTPII] }
  CAPITAL_ADEQUACY:  { control_families: [CF-CAPITAL],  data_domains: [DD-CREDIT, DD-FIN] }
  DATA_QUALITY:      { control_families: [CF-DATAQ],    data_domains: [DD-REF, DD-FIN] }
  DATA_LINEAGE:      { control_families: [CF-LINEAGE],  data_domains: [DD-FIN, DD-CREDIT, DD-TRADE] }
  METADATA:          { control_families: [CF-METADATA], data_domains: [DD-REF] }
  RETENTION:         { control_families: [CF-RETENTION],data_domains: [DD-CUSTPII, DD-ACCT] }
  PRIVACY:           { control_families: [CF-PRIV],     data_domains: [DD-CUSTPII] }
  SCA:               { control_families: [CF-SCA],      data_domains: [DD-PAYMT, DD-CUSTPII] }
  CONDUCT:           { control_families: [CF-CONDUCT],  data_domains: [DD-CUSTPII, DD-ACCT] }
  MODEL_RISK:        { control_families: [CF-MRM],      data_domains: [DD-MODEL, DD-CREDIT] }
  AI_GOVERNANCE:     { control_families: [CF-AIGOV],    data_domains: [DD-MODEL] }
  TRAINING_DATA:     { control_families: [CF-TDQ],      data_domains: [DD-MODEL, DD-CREDIT] }
  TRACEABILITY:      { control_families: [CF-TRACE],    data_domains: [DD-MODEL] }
  AUDITABILITY:      { control_families: [CF-AUDIT],    data_domains: [DD-REF] }
  REG_REPORTING:     { control_families: [CF-REPORT],   data_domains: [DD-FIN, DD-CREDIT] }

# --------------------------------------------------------------------------- #
# Demo cohort (Rule 14 / P-30..P-33) — a curated, NAMED cohort with FIXED
# baseline values so the flagship DORA narrative is deterministic BY DESIGN
# (not seed-dependent). Only these named controls/evidence are pinned; the rest
# of the estate stays seeded for scale. Isolation is by explicit named
# membership (P-31). "Reset to baseline" = re-run `regimpact generate`, which is
# deterministic (P-32). The pins give a graded, narratable story: one strong
# control, one partial, one critical.
# --------------------------------------------------------------------------- #
demo_cohort:
  name: "DORA Operational Resilience"
  regulation: REG-DORA
  # Pinned as-is maturity (0..5); control status is derived from maturity.
  # Covers ALL controls behind DORA's four obligations so the flagship
  # before/after story (dip when the change lands, recover after remediation)
  # is deterministic and assertable (P-30), not seed-dependent.
  controls:
    # ICT resilience (CF-OPRES, obligation target 4) — the flagship graded chain
    CTL-OR-1: { maturity: 2 }
    CTL-OR-2: { maturity: 2 }
    CTL-OR-3: { maturity: 1 }   # the critical gap: target 4 - maturity 1 = shortfall 3
    # Incident management + ICT security (CF-ICTSEC, target 4)
    CTL-IC-1: { maturity: 2 }
    CTL-IC-2: { maturity: 1 }
    CTL-IC-3: { maturity: 2 }
    # Cyber (CF-CYBER, ICT security target 4)
    CTL-CY-1: { maturity: 2 }
    CTL-CY-2: { maturity: 2 }
    # Third-party / outsourcing risk (CF-TPR, target 3)
    CTL-TP-1: { maturity: 1 }
    CTL-TP-2: { maturity: 2 }
  # Pinned evidence status per control + evidence type (drives "provable" compliance).
  evidence:
    CTL-OR-1: { EV-BCP: Partial }
    CTL-OR-2: { EV-BCP: Missing }
    CTL-OR-3: { EV-BCP: Missing }
    CTL-IC-1: { EV-INCIDENT: Partial, EV-DLP: Missing }
    CTL-IC-2: { EV-INCIDENT: Missing, EV-DLP: Missing }
    CTL-IC-3: { EV-INCIDENT: Stale, EV-DLP: Partial }
    CTL-CY-1: { EV-DLP: Partial, EV-ACCESS: Missing }
    CTL-CY-2: { EV-DLP: Missing, EV-ACCESS: Stale }
    CTL-TP-1: { EV-AUDIT: Missing }
    CTL-TP-2: { EV-AUDIT: Partial }

# --------------------------------------------------------------------------- #
# Layer 1 — Regulations + obligation templates.
# `article` records the source clause for the Evidence / audit trail.
# --------------------------------------------------------------------------- #
regulations:
  - id: REG-AIACT
    name: "EU AI Act"
    short_code: "EUAIACT"
    regulator: "European Commission"
    jurisdiction: "EU"
    domain: "AI Governance"
    description: "Risk-based rules for AI systems: data governance, transparency, human oversight and record-keeping for high-risk AI."
    obligation_templates:
      - { theme: TRAINING_DATA, article: "Art. 10", criticality: Critical, target_maturity: 4, statement: "Ensure high-risk AI training, validation and testing data sets are relevant, representative and subject to data governance." }
      - { theme: DATA_LINEAGE,  article: "Art. 10", criticality: High,     target_maturity: 4, statement: "Maintain documented provenance and lineage of data used to train high-risk AI systems." }
      - { theme: TRACEABILITY,  article: "Art. 12", criticality: High,     target_maturity: 4, statement: "Automatically record events over the lifetime of high-risk AI systems to ensure traceability." }
      - { theme: AI_GOVERNANCE, article: "Art. 14", criticality: Critical, target_maturity: 4, statement: "Provide effective human oversight of high-risk AI systems during their use." }
      - { theme: MODEL_RISK,    article: "Art. 15", criticality: High,     target_maturity: 4, statement: "Ensure accuracy, robustness and cybersecurity of high-risk AI systems and monitor performance." }

  - id: REG-NIST
    name: "NIST AI Risk Management Framework"
    short_code: "NISTAIRMF"
    regulator: "NIST"
    jurisdiction: "US"
    domain: "AI Governance"
    description: "Voluntary framework to govern, map, measure and manage risks of AI systems."
    obligation_templates:
      - { theme: AI_GOVERNANCE, article: "GOVERN",  criticality: High,   target_maturity: 4, statement: "Establish AI governance structures, policies and accountability for AI risk." }
      - { theme: MODEL_RISK,    article: "MEASURE", criticality: High,   target_maturity: 4, statement: "Measure AI system performance, robustness and trustworthiness over time." }
      - { theme: TRACEABILITY,  article: "MANAGE",  criticality: Medium, target_maturity: 3, statement: "Document and trace AI system decisions to support contestability and oversight." }

  - id: REG-DORA
    name: "Digital Operational Resilience Act"
    short_code: "DORA"
    regulator: "European Commission / ESAs"
    jurisdiction: "EU"
    domain: "Operational Resilience"
    description: "ICT risk management, incident reporting, resilience testing and third-party risk for financial entities."
    obligation_templates:
      - { theme: ICT_RESILIENCE,   article: "Art. 6",  criticality: Critical, target_maturity: 4, statement: "Maintain a documented ICT risk management framework with mapped important business services and impact tolerances." }
      - { theme: INCIDENT_MGMT,    article: "Art. 17", criticality: Critical, target_maturity: 4, statement: "Detect, manage and classify ICT-related incidents and report major incidents to regulators within mandated timeframes." }
      - { theme: ICT_SECURITY,     article: "Art. 24", criticality: High,     target_maturity: 4, statement: "Perform advanced digital operational resilience testing including threat-led penetration testing." }
      - { theme: THIRD_PARTY_RISK, article: "Art. 28", criticality: High,     target_maturity: 3, statement: "Maintain a register of ICT third-party providers and document exit strategies for critical providers." }

  - id: REG-BASEL
    name: "Basel III/IV Capital Framework (CRR)"
    short_code: "BASEL"
    regulator: "BCBS / EBA"
    jurisdiction: "Global/EU"
    domain: "Prudential"
    description: "Capital adequacy, risk-weighted assets and prudential reporting requirements."
    obligation_templates:
      - { theme: CAPITAL_ADEQUACY, article: "CRR Art. 92",  criticality: Critical, target_maturity: 4, statement: "Calculate risk-weighted assets under the revised approaches and maintain required capital ratios." }
      - { theme: DATA_QUALITY,     article: "CRR Art. 174", criticality: High,     target_maturity: 3, statement: "Ensure data feeding capital calculations meets defined data quality thresholds." }
      - { theme: REG_REPORTING,    article: "CRR Art. 430", criticality: High,     target_maturity: 3, statement: "Produce accurate prudential reporting with auditable sign-off." }

  - id: REG-BCBS239
    name: "BCBS 239 Risk Data Aggregation"
    short_code: "BCBS239"
    regulator: "BCBS"
    jurisdiction: "Global"
    domain: "Risk Data"
    description: "Principles for effective risk data aggregation and risk reporting."
    obligation_templates:
      - { theme: DATA_QUALITY, article: "Principle 3", criticality: High,   target_maturity: 4, statement: "Govern critical data elements with accuracy, completeness and timeliness controls." }
      - { theme: DATA_LINEAGE, article: "Principle 2", criticality: High,   target_maturity: 4, statement: "Aggregate risk data accurately across the group with full traceability and reconciliation." }
      - { theme: METADATA,     article: "Principle 1", criticality: Medium, target_maturity: 3, statement: "Maintain an enterprise catalog and glossary of critical risk data elements." }

  - id: REG-GDPR
    name: "General Data Protection Regulation"
    short_code: "GDPR"
    regulator: "EDPB / National DPAs"
    jurisdiction: "EU"
    domain: "Data Privacy"
    description: "Lawful processing, data subject rights and breach notification for personal data."
    obligation_templates:
      - { theme: PRIVACY,   article: "Art. 6",  criticality: High,     target_maturity: 4, statement: "Maintain lawful basis and consent records for all processing of personal data." }
      - { theme: PRIVACY,   article: "Art. 15", criticality: High,     target_maturity: 3, statement: "Fulfil data subject access and erasure requests within statutory timeframes." }
      - { theme: PRIVACY,   article: "Art. 33", criticality: Critical, target_maturity: 4, statement: "Detect and notify personal data breaches to authorities within 72 hours." }
      - { theme: RETENTION, article: "Art. 5",  criticality: Medium,   target_maturity: 3, statement: "Retain personal data no longer than necessary and enforce retention schedules." }

  - id: REG-PSD2
    name: "Payment Services Directive 2"
    short_code: "PSD2"
    regulator: "EBA"
    jurisdiction: "EU"
    domain: "Payments"
    description: "Strong customer authentication and secure communication for electronic payments."
    obligation_templates:
      - { theme: SCA,            article: "Art. 97",     criticality: Critical, target_maturity: 4, statement: "Apply strong customer authentication to electronic payment transactions." }
      - { theme: SCA,            article: "RTS Art. 18", criticality: High,     target_maturity: 3, statement: "Support transaction risk analysis exemptions with monitored fraud thresholds." }
      - { theme: TXN_MONITORING, article: "Art. 96",     criticality: High,     target_maturity: 3, statement: "Monitor payment fraud rates and report against regulatory reference fraud rates." }

  - id: REG-CONSDUTY
    name: "FCA Consumer Duty"
    short_code: "CONSDUTY"
    regulator: "FCA"
    jurisdiction: "UK"
    domain: "Conduct"
    description: "Deliver good outcomes for retail customers across products, price, understanding and support."
    obligation_templates:
      - { theme: CONDUCT, article: "PRIN 2A.4", criticality: High, target_maturity: 4, statement: "Assess and evidence fair value across the product lifecycle for retail customers." }
      - { theme: CONDUCT, article: "PRIN 2A.9", criticality: High, target_maturity: 3, statement: "Monitor customer outcomes and act on evidence of foreseeable harm." }

  - id: REG-FCAOPRES
    name: "FCA Operational Resilience"
    short_code: "FCAOPRES"
    regulator: "FCA / PRA"
    jurisdiction: "UK"
    domain: "Operational Resilience"
    description: "Identify important business services, set impact tolerances and remain within them through severe disruption."
    obligation_templates:
      - { theme: ICT_RESILIENCE, article: "SYSC 15A", criticality: High, target_maturity: 4, statement: "Identify important business services and set impact tolerances for severe disruption." }
      - { theme: INCIDENT_MGMT,  article: "SYSC 15A", criticality: High, target_maturity: 3, statement: "Test the ability to remain within impact tolerances and remediate vulnerabilities." }

  - id: REG-SEC
    name: "SEC Cybersecurity Disclosure"
    short_code: "SEC"
    regulator: "US SEC"
    jurisdiction: "US"
    domain: "Cyber Disclosure"
    description: "Disclosure of material cybersecurity incidents and governance of cybersecurity risk."
    obligation_templates:
      - { theme: INCIDENT_MGMT, article: "Item 1.05",   criticality: Critical, target_maturity: 4, statement: "Disclose material cybersecurity incidents promptly after determining materiality." }
      - { theme: CYBER,         article: "Reg S-K 106", criticality: High,     target_maturity: 3, statement: "Describe processes for assessing, identifying and managing material cybersecurity risks." }
      - { theme: AUDITABILITY,  article: "Reg S-K 106", criticality: Medium,   target_maturity: 3, statement: "Maintain board oversight evidence of cybersecurity risk governance." }

  - id: REG-OCC
    name: "OCC Heightened Standards"
    short_code: "OCC"
    regulator: "US OCC"
    jurisdiction: "US"
    domain: "Risk Governance"
    description: "Heightened standards for risk governance frameworks of large national banks."
    obligation_templates:
      - { theme: MODEL_RISK,   article: "12 CFR 30 App D", criticality: High,   target_maturity: 4, statement: "Maintain an effective model risk management framework with independent validation." }
      - { theme: AUDITABILITY, article: "12 CFR 30 App D", criticality: High,   target_maturity: 3, statement: "Provide independent audit assurance over the risk governance framework." }
      - { theme: DATA_QUALITY, article: "12 CFR 30 App D", criticality: Medium, target_maturity: 3, statement: "Ensure risk data supporting the framework is accurate and complete." }

  - id: REG-MAS
    name: "MAS Technology Risk Management"
    short_code: "MASTRM"
    regulator: "MAS (Singapore)"
    jurisdiction: "SG"
    domain: "Technology Risk"
    description: "Guidelines on technology risk management, resilience and cyber security for financial institutions."
    obligation_templates:
      - { theme: CYBER,          article: "TRM 9",  criticality: High, target_maturity: 4, statement: "Implement robust cyber security controls and continuous security monitoring." }
      - { theme: ICT_RESILIENCE, article: "TRM 8",  criticality: High, target_maturity: 4, statement: "Ensure system resilience, availability and recoverability of critical systems." }
      - { theme: ACCESS_CONTROL, article: "TRM 11", criticality: High, target_maturity: 3, statement: "Enforce strong access controls and privileged access management." }

  - id: REG-AMLD
    name: "Anti-Money Laundering Directive"
    short_code: "AMLD"
    regulator: "FATF / National FIU"
    jurisdiction: "EU/Global"
    domain: "Financial Crime"
    description: "Customer due diligence, ongoing monitoring, sanctions and suspicious activity reporting obligations."
    obligation_templates:
      - { theme: KYC_CDD,        article: "Art. 13", criticality: Critical, target_maturity: 4, statement: "Apply risk-based customer due diligence including verified beneficial ownership." }
      - { theme: TXN_MONITORING, article: "Art. 18", criticality: Critical, target_maturity: 4, statement: "Monitor transactions for suspicious patterns using risk-tuned detection scenarios." }
      - { theme: SANCTIONS,      article: "Art. 9",  criticality: Critical, target_maturity: 4, statement: "Screen customers and payments against current sanctions and watchlists in real time." }
      - { theme: SAR_REPORTING,  article: "Art. 33", criticality: High,     target_maturity: 3, statement: "Investigate alerts and file suspicious activity reports within regulatory deadlines." }
