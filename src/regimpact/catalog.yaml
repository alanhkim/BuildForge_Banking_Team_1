  - { id: EV-CLASS,     name: "Data Classification Report",   technology_id: TEC-PURVIEW }
  - { id: EV-AUDIT,     name: "Fabric Audit Log",             technology_id: TEC-FABRIC }
  - { id: EV-AGENTEVAL, name: "Agent Evaluation Report",      technology_id: TEC-FOUNDRY }
  - { id: EV-MODELCARD, name: "Model Card",                   technology_id: TEC-FOUNDRY }
  - { id: EV-DLP,       name: "DLP Policy Attestation",       technology_id: TEC-DEFENDER }
  - { id: EV-ACCESS,    name: "Access Review",                technology_id: TEC-ENTRA }
  - { id: EV-DQ,        name: "Data Quality Dashboard",       technology_id: TEC-FABRIC }
  - { id: EV-BCP,       name: "Resilience Test Report",       technology_id: TEC-SERVICENOW }
  - { id: EV-RETENTION, name: "Retention Policy Attestation", technology_id: TEC-PURVIEW }
  - { id: EV-INCIDENT,  name: "Incident Register",            technology_id: TEC-SERVICENOW }
  - { id: EV-SAR,       name: "SAR Filing Log",               technology_id: TEC-FABRIC }
  - { id: EV-CAPREC,    name: "Capital Calc Reconciliation",  technology_id: TEC-FABRIC }
  - { id: EV-MONITOR,   name: "Model Monitoring Report",      technology_id: TEC-FOUNDRY }

