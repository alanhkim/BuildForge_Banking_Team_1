  - { id: PRD-INVEST, name: "Investment Products",  product_line: "Wealth",     owner_unit_id: BU-WEALTH }

# --------------------------------------------------------------------------- #
# Layer 2 — Control families and controls.
#   capability      : the Layer-3 capability the control realises
#   evidence        : Layer-5 evidence types that prove the control operates
#   maturity_bias   : nudge to generated as-is maturity (0 weak .. 2 strong)
# --------------------------------------------------------------------------- #
control_families:
  - id: CF-CDD
    name: "Customer Due Diligence"
    owner_unit_id: BU-RISK
    risk_id: RK-FINCRIME
    capability: CAP-FC
    evidence: [EV-AUDIT, EV-CLASS]
    maturity_bias: 1
    controls:
      - { id: CTL-CDD-1, name: "Identity Verification & KYC", systems: [SYS-KYC] }
      - { id: CTL-CDD-2, name: "Beneficial Ownership Checks", systems: [SYS-KYC] }
      - { id: CTL-CDD-3, name: "Ongoing Customer Risk Rating", systems: [SYS-KYC, SYS-TM] }
  - id: CF-SANCT
    name: "Sanctions Screening"
    owner_unit_id: BU-RISK
    risk_id: RK-FINCRIME
    capability: CAP-SANCT
    evidence: [EV-AUDIT]
    maturity_bias: 2
    controls:
      - { id: CTL-SAN-1, name: "Real-time Payment Screening", systems: [SYS-SANCT, SYS-PAY] }
      - { id: CTL-SAN-2, name: "Watchlist Management", systems: [SYS-SANCT] }
  - id: CF-TM
    name: "Transaction Monitoring"
    owner_unit_id: BU-RISK
    risk_id: RK-FINCRIME
    capability: CAP-FC
    evidence: [EV-SAR, EV-AUDIT]
    maturity_bias: 0
    controls:
      - { id: CTL-TM-1, name: "Behavioural Monitoring Scenarios", systems: [SYS-TM] }
      - { id: CTL-TM-2, name: "Alert Triage & Investigation", systems: [SYS-TM] }
      - { id: CTL-TM-3, name: "Suspicious Activity Reporting (SAR)", systems: [SYS-TM] }
  - id: CF-OPRES
    name: "Operational Resilience"
    owner_unit_id: BU-OPS
    risk_id: RK-OPRES
    capability: CAP-RES
    evidence: [EV-BCP]
    maturity_bias: 0
    controls:
      - { id: CTL-OR-1, name: "Important Business Service Mapping", systems: [SYS-CORE, SYS-PAY] }
      - { id: CTL-OR-2, name: "Impact Tolerances & Scenario Testing", systems: [SYS-CORE] }
      - { id: CTL-OR-3, name: "ICT Continuity & Recovery", systems: [SYS-LAKE, SYS-CORE] }
  - id: CF-ICTSEC
    name: "ICT Security & Incident Mgmt"
    owner_unit_id: BU-TECH
    risk_id: RK-CYBER
    capability: CAP-INC
    evidence: [EV-INCIDENT, EV-DLP]
    maturity_bias: 1
    controls:
      - { id: CTL-IC-1, name: "ICT Incident Detection & Response", systems: [SYS-IAM, SYS-LAKE] }
      - { id: CTL-IC-2, name: "Major Incident Regulatory Notification", systems: [SYS-IAM] }
      - { id: CTL-IC-3, name: "Threat-Led Penetration Testing", systems: [SYS-IAM] }
  - id: CF-TPR
    name: "Third-Party / Outsourcing Risk"
    owner_unit_id: BU-RISK
    risk_id: RK-TPR
    capability: CAP-TPR
    evidence: [EV-AUDIT]
    maturity_bias: 0
    controls:
      - { id: CTL-TP-1, name: "Critical Provider Register", systems: [SYS-LAKE] }
      - { id: CTL-TP-2, name: "Concentration & Exit Strategy", systems: [SYS-LAKE] }
  - id: CF-CYBER
    name: "Cyber Security"
    owner_unit_id: BU-TECH
    risk_id: RK-CYBER
    capability: CAP-CYBER
    evidence: [EV-DLP, EV-ACCESS]
    maturity_bias: 1
    controls:
      - { id: CTL-CY-1, name: "Security Monitoring & SIEM", systems: [SYS-IAM, SYS-LAKE] }
      - { id: CTL-CY-2, name: "Vulnerability Management", systems: [SYS-IAM] }
  - id: CF-ACCESS
    name: "Access Control"
    owner_unit_id: BU-TECH
    risk_id: RK-CYBER
    capability: CAP-AC
    evidence: [EV-ACCESS]
    maturity_bias: 1
    controls:
      - { id: CTL-AC-1, name: "Role-Based Access & Least Privilege", systems: [SYS-IAM] }
      - { id: CTL-AC-2, name: "Privileged Access Reviews", systems: [SYS-IAM] }
  - id: CF-CAPITAL
