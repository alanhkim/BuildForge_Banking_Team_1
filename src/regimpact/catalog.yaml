  - { id: CAP-LIN,     name: "Data Lineage",                  domain: "Data",        technologies: [TEC-PURVIEW, TEC-FABRIC] }
  - { id: CAP-DQ,      name: "Data Quality",                  domain: "Data",        technologies: [TEC-FABRIC, TEC-INFORMATICA] }
  - { id: CAP-MDM,     name: "Metadata & Catalog",            domain: "Data",        technologies: [TEC-PURVIEW, TEC-COLLIBRA] }
  - { id: CAP-PII,     name: "PII Protection",                domain: "Privacy",     technologies: [TEC-PURVIEW, TEC-DEFENDER] }
  - { id: CAP-RET,     name: "Data Retention",                domain: "Data",        technologies: [TEC-PURVIEW, TEC-POLICY] }
  - { id: CAP-AC,      name: "Access Control",                domain: "Security",    technologies: [TEC-ENTRA] }
  - { id: CAP-AUD,     name: "Auditability & Evidence",       domain: "Governance",  technologies: [TEC-FABRIC, TEC-PURVIEW] }
  - { id: CAP-REP,     name: "Regulatory Reporting",          domain: "Finance",     technologies: [TEC-FABRIC] }
  - { id: CAP-MRM,     name: "Model Risk Management",         domain: "AI",          technologies: [TEC-FOUNDRY, TEC-FABRIC] }
  - { id: CAP-AIG,     name: "AI Governance",                 domain: "AI",          technologies: [TEC-FOUNDRY, TEC-PURVIEW] }
  - { id: CAP-TDQ,     name: "Training Data Quality",         domain: "AI",          technologies: [TEC-FABRIC, TEC-FOUNDRY] }
  - { id: CAP-TRACE,   name: "Traceability & Explainability", domain: "AI",          technologies: [TEC-FOUNDRY, TEC-PURVIEW] }
  - { id: CAP-RES,     name: "Operational Resilience",        domain: "Resilience",  technologies: [TEC-SERVICENOW, TEC-FABRIC] }
  - { id: CAP-INC,     name: "Incident Management",           domain: "Resilience",  technologies: [TEC-SERVICENOW, TEC-DEFENDER] }
  - { id: CAP-TPR,     name: "Third-Party / ICT Dependency",  domain: "Resilience",  technologies: [TEC-SERVICENOW] }
  - { id: CAP-CYBER,   name: "Cyber Security",                domain: "Security",    technologies: [TEC-DEFENDER, TEC-ENTRA] }
  - { id: CAP-FC,      name: "Financial Crime Detection",     domain: "FinCrime",    technologies: [TEC-FABRIC] }
  - { id: CAP-SANCT,   name: "Sanctions Screening",           domain: "FinCrime",    technologies: [TEC-FABRIC] }
  - { id: CAP-AUTH,    name: "Strong Authentication",         domain: "Security",    technologies: [TEC-ENTRA] }
  - { id: CAP-CAPITAL, name: "Capital & RWA",                 domain: "Prudential",  technologies: [TEC-FABRIC] }
  - { id: CAP-COND,    name: "Conduct & Fair Value",          domain: "Conduct",     technologies: [TEC-FABRIC] }

