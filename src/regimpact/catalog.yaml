# =========================================================================== #
# Regulatory Change Impact Intelligence Framework — Reference Catalog
# ---------------------------------------------------------------------------
# Five-layer model (a "digital twin" of the enterprise compliance posture):
#
#   Layer 1  Regulation Knowledge Base   regulations + changes + obligations
#   Layer 2  Control Ontology            control_families / controls
#   Layer 3  Capability Model            capabilities
#   Layer 4  Technology Mapping          technologies
#   Layer 5  Evidence Layer              evidence_types  (instantiated per control)
#
# Correlation backbone:
#   obligation.theme -> themes[*].control_families -> controls
#   control.family   -> control_families[*].capability  -> capabilities
#   capability       -> capabilities[*].technologies     -> technologies
#   control.family   -> control_families[*].evidence      -> evidence (instances)
#   obligation.theme -> themes[*].data_domains            -> data_domains
#
# To support a NEW regulation: add an entry under `regulations` that references
# existing `themes`. No code changes required.
# =========================================================================== #

business_units:
  - { id: BU-RETAIL,   name: "Retail Banking",        division: "Customer" }
  - { id: BU-COMM,     name: "Commercial Banking",    division: "Customer" }
  - { id: BU-WEALTH,   name: "Wealth Management",     division: "Customer" }
  - { id: BU-MARKETS,  name: "Markets & Treasury",    division: "Wholesale" }
  - { id: BU-OPS,      name: "Operations",            division: "COO" }
  - { id: BU-RISK,     name: "Risk & Compliance",     division: "CRO" }
  - { id: BU-TECH,     name: "Technology",            division: "CIO" }
  - { id: BU-DATA,     name: "Chief Data Office",     division: "CDO" }
  - { id: BU-FIN,      name: "Finance",               division: "CFO" }

data_domains:
  - { id: DD-CUSTPII,  name: "Customer PII",          classification: "Restricted",    contains_pii: true }
  - { id: DD-KYC,      name: "KYC / CDD Data",        classification: "Confidential",  contains_pii: true }
  - { id: DD-TXN,      name: "Transactions",          classification: "Confidential",  contains_pii: false }
  - { id: DD-ACCT,     name: "Account Data",          classification: "Confidential",  contains_pii: false }
  - { id: DD-CREDIT,   name: "Credit & Risk Data",    classification: "Confidential",  contains_pii: false }
  - { id: DD-TRADE,    name: "Trade & Position Data", classification: "Confidential",  contains_pii: false }
  - { id: DD-MODEL,    name: "AI / Model Data",       classification: "Confidential",  contains_pii: false }
  - { id: DD-REF,      name: "Reference Data",        classification: "Internal",      contains_pii: false }
  - { id: DD-FIN,      name: "Financial / GL Data",   classification: "Confidential",  contains_pii: false }
  - { id: DD-PAYMT,    name: "Payments Data",         classification: "Confidential",  contains_pii: false }

risks:
  - { id: RK-FINCRIME, name: "Financial Crime / AML",     category: "Compliance",     inherent_rating: "Critical" }
  - { id: RK-OPRES,    name: "Operational Resilience",    category: "Operational",    inherent_rating: "High" }
  - { id: RK-CYBER,    name: "Cyber & ICT",               category: "Technology",     inherent_rating: "Critical" }
  - { id: RK-CREDIT,   name: "Credit Risk",               category: "Financial",      inherent_rating: "High" }
  - { id: RK-MARKET,   name: "Market Risk",               category: "Financial",      inherent_rating: "High" }
  - { id: RK-PRIV,     name: "Data Privacy",              category: "Compliance",     inherent_rating: "High" }
  - { id: RK-CONDUCT,  name: "Conduct Risk",              category: "Compliance",     inherent_rating: "High" }
  - { id: RK-REPORT,   name: "Regulatory Reporting",      category: "Compliance",     inherent_rating: "High" }
  - { id: RK-TPR,      name: "Third-Party Risk",          category: "Operational",    inherent_rating: "High" }
  - { id: RK-MODEL,    name: "Model / AI Risk",           category: "Compliance",     inherent_rating: "High" }

# --------------------------------------------------------------------------- #
# Layer 4 — Technologies (enabling platforms / tooling).
# --------------------------------------------------------------------------- #
technologies:
  - { id: TEC-FABRIC,      name: "Microsoft Fabric",            vendor: "Microsoft",   category: "Analytics",   is_microsoft: true }
  - { id: TEC-ONELAKE,     name: "OneLake",                     vendor: "Microsoft",   category: "Storage",     is_microsoft: true }
  - { id: TEC-PURVIEW,     name: "Microsoft Purview",           vendor: "Microsoft",   category: "Governance",  is_microsoft: true }
  - { id: TEC-FOUNDRY,     name: "Azure AI Foundry",            vendor: "Microsoft",   category: "AI",          is_microsoft: true }
  - { id: TEC-POLICY,      name: "Azure Policy",                vendor: "Microsoft",   category: "Policy",      is_microsoft: true }
  - { id: TEC-ENTRA,       name: "Microsoft Entra ID",          vendor: "Microsoft",   category: "Identity",    is_microsoft: true }
  - { id: TEC-DEFENDER,    name: "Microsoft Defender/Sentinel", vendor: "Microsoft",   category: "Security",    is_microsoft: true }
  - { id: TEC-DATABRICKS,  name: "Databricks",                  vendor: "Databricks",  category: "Analytics",   is_microsoft: false }
  - { id: TEC-SNOWFLAKE,   name: "Snowflake",                   vendor: "Snowflake",   category: "Storage",     is_microsoft: false }
  - { id: TEC-INFORMATICA, name: "Informatica",                 vendor: "Informatica", category: "Data Mgmt",   is_microsoft: false }
  - { id: TEC-SERVICENOW,  name: "ServiceNow",                  vendor: "ServiceNow",  category: "Workflow",    is_microsoft: false }
  - { id: TEC-COLLIBRA,    name: "Collibra",                    vendor: "Collibra",    category: "Governance",  is_microsoft: false }

# --------------------------------------------------------------------------- #
# Layer 3 — Capabilities. Each capability is enabled by one or more
# technologies (Layer 4).
# --------------------------------------------------------------------------- #
